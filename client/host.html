<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Haunted Gallery Host</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0709'/%3E%3Crect x='7' y='6' width='18' height='20' fill='none' stroke='%23e5c07b' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23b3202f'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/styles.css" />
  <link rel="stylesheet" href="/src/host.css" />
</head>
<body class="host">
  <main>
    <section id="h-auth" class="card">
      <h1>Haunted Gallery</h1>
      <p class="sub">Host console — start, pause and reset the match. Keep this screen private: it shows no hidden positions, but it controls the game.</p>
      <label>Host key<input id="h-key" type="password" autocomplete="current-password" placeholder="Set on the server as HOST_KEY" /></label>
      <button id="h-create" class="primary">Create a new session</button>
      <p class="fine" id="h-auth-note"></p>
    </section>

    <section id="h-console" hidden>
      <div class="h-grid">
        <div class="card">
          <h2>Scan to play</h2>
          <canvas id="h-qr"></canvas>
          <div class="h-code" id="h-code">—</div>
          <div class="h-url"><input id="h-url" readonly /></div>
          <p class="fine" id="h-url-note"></p>
        </div>
        <div class="card">
          <h2 id="h-phase">Lobby</h2>
          <div class="h-stats" id="h-stats"></div>
          <div class="row">
            <button class="btn primary" id="h-start">Start match</button>
            <button class="btn" id="h-pause">Pause</button>
            <button class="btn" id="h-reset">Reset to lobby</button>
          </div>
          <label class="h-toggle"><input type="checkbox" id="h-cpu" checked /> Fill empty seats with CPU survivors (only when fewer than 12 join)</label>
          <h3>Guests</h3>
          <div id="h-roster"></div>
          <div id="h-results"></div>
        </div>
      </div>
    </section>
  </main>
  <div id="toast" hidden></div>
  <script type="module" src="/src/host.js"></script>
</body>
</html>
