<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0709" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Haunted Gallery</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0709'/%3E%3Crect x='7' y='6' width='18' height='20' fill='none' stroke='%23e5c07b' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23b3202f'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="tags" aria-hidden="true"></div>
  <div id="flash"></div>
  <div id="vignette"></div>

  <header id="hud" hidden>
    <div class="hud-left">
      <div id="hud-room">—</div>
      <div id="hud-status"></div>
    </div>
    <div class="hud-right">
      <div id="hud-phase">—</div>
      <div id="hud-timer">0</div>
      <div id="hud-clock"></div>
    </div>
    <div id="hud-team"></div>
  </header>

  <div id="caption" role="status" aria-live="polite"></div>
  <div id="threat" hidden></div>
  <section id="inbox"></section>
  <section id="sounds" aria-live="polite"></section>
  <section id="briefing" class="screen" hidden></section>
  <section id="panel" hidden></section>
  <div id="stick" hidden aria-label="Move: push gently to walk, all the way to run">
    <div class="stick-base"><div class="stick-knob"></div></div>
    <div class="stick-label"></div>
  </div>
  <div id="actions" hidden></div>

  <section id="screen-join" class="screen">
    <div class="card">
      <h1>Haunted<br/>Gallery</h1>
      <p class="sub">Escape alive. Save who you can.</p>
      <label>Join code<input id="join-code" autocomplete="off" autocapitalize="characters" maxlength="5" placeholder="ABCDE" /></label>
      <label>Your name<input id="join-name" autocomplete="nickname" maxlength="20" placeholder="Your first name" /></label>
      <button id="join-go" class="primary">Enter the mansion</button>
      <p class="fine" id="join-note">Sound on, please. Keep this screen awake during the game.</p>
    </div>
  </section>

  <section id="screen-lobby" class="screen" hidden>
    <div class="card wide">
      <h2>Choose your guest</h2>
      <p class="sub" id="lobby-sub">Each guest can be chosen once.</p>
      <div id="cast-grid"></div>
      <p class="fine" id="lobby-wait">Waiting for the host to start…</p>
    </div>
  </section>

  <section id="screen-results" class="screen" hidden>
    <div class="card wide" id="results"></div>
  </section>

  <div id="sheet" hidden><div class="sheet-body" id="sheet-body"></div></div>
  <div id="toast" hidden></div>
  <div id="conn" hidden></div>
  <pre id="debug" hidden></pre>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
